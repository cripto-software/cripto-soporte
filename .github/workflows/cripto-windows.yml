# ============================================================
# 📁 RUTA   : .github/workflows/cripto-windows.yml
# 📌 ARCHIVO: cripto-windows.yml
# 📝 RESUMEN: Compila CRIPTO Soporte para Windows (x64), el programa
#             del técnico para dar soporte a celulares y computadoras:
#             servidor y llave propios (Secrets), nombre, íconos y logo
#             CRIPTO, calidad máxima por defecto y ajustes de servidor
#             bloqueados. Entrega un solo .exe que se abre sin instalar
#             (y desde él se puede instalar). Solo se ejecuta a mano
#             (botón «Run workflow»).
# 👤 AUTOR   : Téc. Sup. Pablo Quichimbo — PCG SAS
# ©  Propiedad intelectual de Pablo Quichimbo. Todos los derechos reservados.
#    (Trabajo derivado de RustDesk, licencia AGPL-3.0.)
# ------------------------------------------------------------
# Historial
#   v1.0  24/11/2026  Versión inicial (basada en el trabajo Windows de
#                     flutter-build.yml de RustDesk 1.5.3, solo x64, sin
#                     MSI ni controladores opcionales de pantalla virtual
#                     e impresora).
#   v1.1  25/11/2026  Corrige la instalación: el ejecutable se renombra a
#                     CRIPTO-Soporte.exe (igual al nombre interno de la app).
#                     El instalador copia la carpeta tal cual y crea los
#                     accesos directos apuntando a «<nombre interno>.exe»; con
#                     rustdesk.exe salía «Windows no puede encontrar el
#                     archivo C:\Program Files\CRIPTO-Soporte\CRIPTO-Soporte.exe».
#                     Verifica que el .exe exista antes de empaquetar.
# Mantenimiento: tras cada «Sync fork», si la compilación falla,
# copiar aquí las versiones del bloque env de flutter-build.yml.
# ============================================================

name: CRIPTO Soporte - Windows

on:
  workflow_dispatch:

# Mínimo privilegio: solo lectura del código.
permissions:
  contents: read

# Evita dos compilaciones a la vez que se pisen.
concurrency:
  group: cripto-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"
  NOMBRE_EXE: "CRIPTO-Soporte"
  # v1.1 — Debe ser IGUAL a NOMBRE_INTERNO_WINDOWS de cripto/aplicar_marca.py.
  NOMBRE_INTERNO: "CRIPTO-Soporte"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows:
    needs: [generate-bridge]
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Exportar variables de caché
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Descargar el código
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restaurar archivos del puente Flutter-Rust
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Instalar Python y librerías de imagen
        shell: bash
        run: |
          python3 --version
          pip3 install pillow numpy

      - name: Aplicar marca CRIPTO (Windows)
        env:
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
        shell: bash
        run: python3 cripto/aplicar_marca.py --windows

      - name: Instalar LLVM y Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Instalar Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Motor Flutter de RustDesk para Windows
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Parche de Flutter (menús desplegables)
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: cripto-windows-2022

      - name: Preparar vcpkg con caché
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Instalar dependencias de vcpkg
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Compilar CRIPTO Soporte
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # v1.1 — El ejecutable lleva el nombre interno de la app (lo exige el instalador).
          if (-not (Test-Path "./rustdesk/rustdesk.exe")) { throw "[CRIPTO] No se generó rustdesk.exe" }
          Rename-Item -Path "./rustdesk/rustdesk.exe" -NewName "$env:NOMBRE_INTERNO.exe"
          if (-not (Test-Path "./rustdesk/$env:NOMBRE_INTERNO.exe")) { throw "[CRIPTO] No se pudo renombrar el ejecutable" }
          Write-Host "[CRIPTO] Ejecutable: $env:NOMBRE_INTERNO.exe"
          Write-Host "[CRIPTO] Archivos compilados:"
          Get-ChildItem ./rustdesk | Select-Object Name, Length | Format-Table -AutoSize

      - name: Armar el ejecutable único (.exe)
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${NOMBRE_INTERNO}.exe"
          popd
          mkdir -p ./SalidaCripto
          mv ./target/release/rustdesk-portable-packer.exe "./SalidaCripto/${NOMBRE_EXE}-${VERSION}-x64.exe"
          cd ./SalidaCripto
          sha256sum "${NOMBRE_EXE}-${VERSION}-x64.exe" > "${NOMBRE_EXE}-${VERSION}-x64.exe.sha256"
          cat "${NOMBRE_EXE}-${VERSION}-x64.exe.sha256"
          ls -la

      - name: Resumen
        shell: bash
        run: |
          {
            echo "## CRIPTO Soporte para Windows"
            echo ""
            echo "- Archivo: \`${NOMBRE_EXE}-${VERSION}-x64.exe\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "./SalidaCripto/${NOMBRE_EXE}-${VERSION}-x64.exe.sha256")\`"
            echo "- Sin firma de código: Windows SmartScreen pedirá «Más información → Ejecutar de todas formas»."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir el ejecutable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cripto-soporte-${{ env.VERSION }}-windows-x64
          path: ./SalidaCripto
          if-no-files-found: error
